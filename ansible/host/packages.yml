---
- name: Load OS-specific variables
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/group_vars/{{ ansible_facts['distribution'] | lower }}.yml"
  when: ansible_facts['distribution'] in ['Ubuntu', 'Fedora']

- name: Load Ubuntu package tasks
  ansible.builtin.include_tasks: packages_ubuntu.yml
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Load Fedora package tasks
  ansible.builtin.include_tasks: packages_fedora.yml
  when: ansible_facts['distribution'] == 'Fedora'

- name: Fail on unsupported distribution
  ansible.builtin.fail:
    msg: "Unsupported distribution: {{ ansible_facts['distribution'] }}"
  when: ansible_facts['distribution'] not in ['Ubuntu', 'Fedora']

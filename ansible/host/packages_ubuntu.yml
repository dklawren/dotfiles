---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
  become: true

# Remove snap and reinstall preinstalled desktop apps (firefox, thunderbird)
# via flatpak, which are already covered by `flatpak_apps` in all.yml.
- name: Remove snap support
  ansible.builtin.include_tasks: snap.yml

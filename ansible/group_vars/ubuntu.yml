  - fastboot
  - fastfetch
  - ffmpeg
  - flatpak
  - fonts-cantarell
  - fonts-firacode
  - fonts-inter
  - fonts-jetbrains-mono
  - fonts-liberation2
  - fonts-noto
  - fonts-noto-cjk
  - fonts-noto-color-emoji
  - gcc
  - git
  - gnome-software-plugin-flatpak
  - gnome-shell-extension-appindicator
  - gnome-shell-extension-auto-move-windows
  - gnome-tweaks
  - gnupg
  - libfuse2t64
  - linux-headers-generic

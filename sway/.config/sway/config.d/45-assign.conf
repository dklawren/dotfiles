# Pin apps to workspaces (matched on Wayland app_id, or X11 class for XWayland).
# Check real IDs with: swaymsg -t get_tree | jq -r '.. | .app_id? // empty'
assign [app_id="(?i)^org\.gnome\.Fractal$"]            workspace number 1
assign [app_id="(?i)^slack$"]                          workspace number 1
assign [class="(?i)^slack$"]                           workspace number 1
assign [app_id="(?i)hylki"]                            workspace number 2
assign [app_id="(?i)thunderbird"]                      workspace number 2
assign [class="(?i)hylki"]                             workspace number 2
assign [app_id="(?i)^firefox-nightly$"]                workspace number 3
assign [class="(?i)^firefox-nightly$"]                 workspace number 3
# Only the login terminal (own app_id) — a plain ghostty match would catch every Mod+Return
assign [app_id="^com\.mitchellh\.ghostty\.ws4$"]       workspace number 4
assign [app_id="(?i)silverbullet"]                     workspace number 5
assign [class="(?i)silverbullet"]                      workspace number 5
assign [app_id="(?i)super.?productivity"]              workspace number 5
assign [class="(?i)super.?productivity"]               workspace number 5

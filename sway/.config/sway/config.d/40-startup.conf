exec_always dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP=sway
exec_always systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK

# Dark mode for GTK apps (GTK4/libadwaita + portal-aware apps read color-scheme)
exec_always gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec_always gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'

exec kanshi
exec swaync
exec swayosd-server
exec /usr/libexec/polkit-gnome-authentication-agent-1 || /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
exec nm-applet --indicator
exec blueman-applet
exec gnome-keyring-daemon --start --components=secrets
exec wl-paste --type text  --watch cliphist store
exec wl-paste --type image --watch cliphist store
exec $bin/sway-nightlight start

# Idle: dim 5m, lock 10m, screen off 15m, suspend 30m
exec swayidle -w \
    timeout 300  'brightnessctl -d intel_backlight -s set 10%' resume 'brightnessctl -d intel_backlight -r' \
    timeout 600  '$bin/sway-lock' \
    timeout 900  'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
    timeout 1800 'systemctl suspend' \
    before-sleep '$bin/sway-lock' \
    lock '$bin/sway-lock'

# Login apps (placed on workspaces by assign rules in 45-assign.conf)
exec flatpak run org.gnome.Fractal
exec flatpak run com.slack.Slack
exec flatpak run co.hyprlab.Hylki
exec gtk-launch firefox-nightly
exec ghostty
exec flatpak run plus.silverbullet.desktop
exec flatpak run com.super_productivity.SuperProductivity

default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart
gaps inner 8
gaps outer 0
smart_gaps on
focus_follows_mouse yes
seat * xcursor_theme Adwaita 24

#                       border   background text  indicator child_border
client.focused          $accent  $bg1        $fg   $accent   $accent
client.focused_inactive $bg2     $bg         $fg   $bg2      $bg2
client.unfocused        $bg1     $bg         $gray $bg1      $bg1
client.urgent           $red     $red        $fg   $red      $red
client.placeholder      $bg      $bg         $fg   $bg       $bg
client.background       $bg

output * bg ~/.config/sway/wallpapers/gruvbox.png fill $bg

bar {
    swaybar_command waybar
}

for_window [app_id="pavucontrol|nm-connection-editor|blueman-manager|swappy|org.gnome.Calculator|polkit-gnome-authentication-agent-1"] floating enable
for_window [window_role="pop-up|dialog|bubble|task_dialog"] floating enable
for_window [app_id="dev.dkl.swaykeys"] floating enable, resize set 1000 700, move position center
for_window [app_id=".*"] inhibit_idle fullscreen
for_window [class=".*"] inhibit_idle fullscreen

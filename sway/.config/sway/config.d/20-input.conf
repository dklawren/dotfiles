input type:keyboard {
    xkb_layout us
    repeat_delay 300
    repeat_rate 40
}
input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
    middle_emulation enabled
    scroll_method two_finger
    accel_profile adaptive
}

# Lid: lock+suspend when alone, otherwise just drop the internal panel
bindswitch --reload --locked lid:on  exec $bin/sway-lid close
bindswitch --reload --locked lid:off exec $bin/sway-lid open
